# Typical sizes of the things a detector finds, for the box_size estimator: the distance to a
# detection is the focal length times its real size over its size in the image (pinhole camera).
#
#   <name>: {height: <m>, width: <m>, aliases: [<other names>]}
#
# height: its vertical size as the camera sees it (a person standing; a cup upright).
# width:  its horizontal size, used when the box is cut by the top or the bottom of the image
#         (then the height in the image is not the whole height). Omit it if it varies too much
#         with the point of view.
# aliases: other names of the same thing (singular, lowercase). A label is matched by the name
#         or alias it contains (the head of the noun phrase: "person with a red shirt" -> person,
#         "red coffee cup" -> cup); see detection_3d_estimators/object_sizes.py.
#
# The values are typical adult / household sizes: the error of a distance is the error of the
# size (a person of 1.60 m taken as 1.75 m: 9 % too far). Override them for your setting with the
# parameter `sizes` of the node, or give your own file (`object_sizes_file`).
#
# The first block are the 80 classes of COCO (the classes of YOLO models trained on COCO); the
# second, other things common indoors, for open-vocabulary detectors.

# --- COCO
