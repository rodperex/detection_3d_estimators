# The 80 classes of COCO in the order of their indices, for a detector that gives the class as
# a number (class_id "0" = person), e.g. a YOLO trained on COCO. Give it to the node:
#   ros2 launch detection_3d_estimators detection_3d_estimator.launch.py estimator:=box_size \
#     params_file:=$(ros2 pkg prefix detection_3d_estimators)/share/detection_3d_estimators/config/class_names_coco.yaml
detection_3d_estimator:
  ros__parameters:
    class_names:
    - person
    - bicycle
    - car
    - motorcycle
    - airplane
    - bus
    - train
    - truck
    - boat
    - traffic light
    - fire hydrant
    - stop sign
    - parking meter
